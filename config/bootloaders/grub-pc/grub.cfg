    if [ -f /live/initrd.img ]; then
      echo "ctOS // INSTALL PROTOCOL (GUI)..."
      linux16 /live/vmlinuz boot=live components hostname=greenwayos username=user noautologin greenwayos.install=1 greenwayos.gui_install=1 video=1280x800 systemd.show_status=1 systemd.mask=lightdm.service systemd.mask=NetworkManager-wait-online.service systemd.mask=bluetooth.service plymouth.enable=0 rd.plymouth=0 consoleblank=0
      initrd16 /live/initrd.img
    else
      echo "FATAL: /live/initrd.img missing on ${root}"
