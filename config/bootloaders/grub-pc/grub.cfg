set timeout=8
set default=0

# Required modules: kernel, initrd, filesystems, device search
insmod gzio
insmod part_gpt
insmod part_msdos
insmod iso9660
insmod fat
insmod biosdisk
insmod linux16
insmod search
insmod search_fs_file
insmod echo

if loadfont /boot/grub/font.pf2 ; then
  set gfxmode=auto
  insmod all_video
  insmod gfxterm
  terminal_output gfxterm
fi

set menu_color_normal=cyan/black
set menu_color_highlight=black/cyan
set color_normal=cyan/black
set color_highlight=black/cyan

# Locate live medium: virtual CD, USB/hybrid, or search by marker file
set gwo_root_ok=0
if [ -e (cd0)/live/vmlinuz ]; then
  if [ -e (cd0)/live/initrd.img ]; then
    set root=(cd0)
    set gwo_root_ok=1
  fi
fi
if [ "${gwo_root_ok}" = "0" ]; then
  if [ -e (cd1)/live/vmlinuz ]; then
    if [ -e (cd1)/live/initrd.img ]; then
      set root=(cd1)
      set gwo_root_ok=1
    fi
  fi
fi
if [ "${gwo_root_ok}" = "0" ]; then
  if search --no-floppy --set=root --file /live/vmlinuz; then
    set gwo_root_ok=1
  fi
fi

if [ "${gwo_root_ok}" = "0" ]; then
  echo "ERROR: Could not locate /live/vmlinuz on any device"
  echo "Check ISO integrity and boot media (CD/USB)."
  sleep 15
else
  if [ ! -f /live/vmlinuz ]; then
    echo "ERROR: Kernel not found: /live/vmlinuz on ${root}"
    sleep 10
  fi
  if [ ! -f /live/initrd.img ]; then
    echo "ERROR: Initrd not found: /live/initrd.img on ${root}"
    sleep 10
  fi
fi

menuentry "LIVE NODE" {
  if [ -f /live/vmlinuz ]; then
    if [ -f /live/initrd.img ]; then
      echo "ctOS // booting LIVE NODE..."
      linux16 /live/vmlinuz boot=live components hostname=greenwayos username=user systemd.mask=NetworkManager-wait-online.service systemd.mask=bluetooth.service plymouth.enable=0 rd.plymouth=0 consoleblank=0
      initrd16 /live/initrd.img
    else
      echo "FATAL: /live/initrd.img missing on ${root}"
      sleep 8
    fi
  else
    echo "FATAL: /live/vmlinuz missing on ${root}"
    sleep 8
  fi
}

menuentry "SAFE LIVE" {
  if [ -f /live/vmlinuz ]; then
    if [ -f /live/initrd.img ]; then
      echo "ctOS // SAFE LIVE (nomodeset)..."
