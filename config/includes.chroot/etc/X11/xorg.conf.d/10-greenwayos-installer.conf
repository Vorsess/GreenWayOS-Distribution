# Fallback modes for the standalone installer X session (VMs without EDID).
# Per-driver configs are generated at runtime in /run/greenwayos-xorg.conf.

Section "ServerFlags"
    Option "DontVTSwitch" "false"
    Option "AllowMouseOpenFail" "true"
EndSection

Section "Monitor"
    Identifier "GreenWayOS Installer Monitor"
    Option "PreferredMode" "1024x768"
EndSection

Section "Screen"
    Identifier "GreenWayOS Installer Screen"
    Monitor "GreenWayOS Installer Monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1024x768" "1280x720" "1920x1080"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "GreenWayOS Installer Layout"
    Screen "GreenWayOS Installer Screen"
EndSection
