#!/bin/bash
# ══════════════════════════════════════════════════════════════════════
#  GreenWayOS Color Theme Configuration
#  Unified color palette for all scripts and configurations
#  Source this file to get consistent colors across the project
# ══════════════════════════════════════════════════════════════════════

# ── Primary Brand Color ────────────────────────────────────────────────
export THEME_PRIMARY_HEX="#1DB954"          # Spotify green (GreenWay brand)
export THEME_PRIMARY_BRIGHT="\033[1;32m"    # ANSI bright green
export THEME_PRIMARY_DIM="\033[0;32m"       # ANSI normal green

# ── Background Colors ──────────────────────────────────────────────────
export THEME_BG_DARK="#0D0D0D"              # Almost black
export THEME_BG_MID="#1A1A1A"               # Dark gray
export THEME_BG_LIGHT="#2C2C2C"             # Light dark gray
export THEME_BG_DARKER="#000000"            # Pure black

# ── Text Colors ────────────────────────────────────────────────────────
export THEME_TEXT_PRIMARY="#FFFFFF"         # White
export THEME_TEXT_SECONDARY="#AAAAAA"       # Light gray
export THEME_TEXT_DIMMED="#666666"          # Dark gray
export THEME_TEXT_MUTED="#444444"           # Very dark gray

# ── Status Colors (ANSI Codes) ─────────────────────────────────────────
export THEME_COLOR_SUCCESS="\033[0;32m"     # Green
export THEME_COLOR_ERROR="\033[0;31m"       # Red
export THEME_COLOR_WARNING="\033[1;33m"     # Yellow
export THEME_COLOR_INFO="\033[0;36m"        # Cyan
export THEME_COLOR_NOTICE="\033[1;36m"      # Bright Cyan

# ── ANSI Formatting ────────────────────────────────────────────────────
export THEME_RESET="\033[0m"                # Reset to default
export THEME_BOLD="\033[1m"                 # Bold text
export THEME_DIM="\033[2m"                  # Dim text
export THEME_ITALIC="\033[3m"               # Italic text
export THEME_UNDERLINE="\033[4m"            # Underline text

# ── Composite Styles ──────────────────────────────────────────────────
export THEME_SUCCESS="${THEME_COLOR_SUCCESS}✓${THEME_RESET}"
export THEME_ERROR="${THEME_COLOR_ERROR}✗${THEME_RESET}"
export THEME_WARNING="${THEME_COLOR_WARNING}⚠${THEME_RESET}"
export THEME_INFO="${THEME_COLOR_INFO}ℹ${THEME_RESET}"
export THEME_NOTICE="${THEME_COLOR_NOTICE}→${THEME_RESET}"

# ── Helper functions for consistent output ─────────────────────────────

theme_success() {
    printf "%b✓%b  %s\n" "${THEME_COLOR_SUCCESS}" "${THEME_RESET}" "$@"
}

theme_error() {
    printf "%b✗%b  %s\n" "${THEME_COLOR_ERROR}" "${THEME_RESET}" "$@" >&2
}

theme_warning() {
    printf "%b⚠%b  %s\n" "${THEME_COLOR_WARNING}" "${THEME_RESET}" "$@" >&2
}

theme_info() {
    printf "%b→%b  %s\n" "${THEME_COLOR_INFO}" "${THEME_RESET}" "$@"
}

theme_header() {
    printf "\n%b=== %s ===%b\n" "${THEME_BOLD}${THEME_PRIMARY_BRIGHT}" "$@" "${THEME_RESET}"
}

theme_section() {
    printf "\n%b%s%b\n" "${THEME_COLOR_INFO}" "$@" "${THEME_RESET}"
}

# ── Version Info ───────────────────────────────────────────────────────
export THEME_VERSION="1.0"
export THEME_LAST_UPDATED="2026-04-21"

# Verify theme is loaded
if [[ "${BASH_SOURCE[0]}" == "${0}" ]]; then
    echo "GreenWayOS Theme Palette v${THEME_VERSION}"
    echo "Primary color: ${THEME_PRIMARY_HEX}"
    echo "Status: Loaded successfully"
fi
